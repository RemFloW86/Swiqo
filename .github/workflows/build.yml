name: Build rootless .deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git \
            libxml2 libtinfo6 libz3-dev libplist-utils wget xz-utils

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -L --fail -o /tmp/swift-toolchain.tar.xz \
            https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz
          tar -xJf /tmp/swift-toolchain.tar.xz -C "$THEOS/toolchain"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L --fail -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"

      - name: Build package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Show package
        run: ls -l packages

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: PullOverPro-iOS26-rootless
          path: packages/*.deb
          if-no-files-found: error
